name: Verify ontology release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
      - run: python -m pipeline.cli build && git diff --exit-code -- dist
      - uses: actions/upload-artifact@v4
        with:
          name: formal-sciences-rdf-v1
          path: dist/
