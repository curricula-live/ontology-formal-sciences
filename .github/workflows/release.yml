name: Publish tagged RDF package
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a versioned commit already accepted on main
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python - <<'PY'
          import json,os
          config=json.load(open("ontology.yaml"))
          version=config["version"]
          if int(version.split(".")[0]) >= 1:
              assert config.get("release",{}).get("status")=="stable", "Candidate packages cannot be published"
          assert os.environ["GITHUB_REF_NAME"]=="v"+version, "Tag does not match ontology version"
          PY
      - run: pip install -r requirements.lock
      - name: Verify the tagged RDF package
        run: |
          python -m pytest -q
          python -m pipeline.cli build
          python -m pipeline.package_check dist
          test -z "$(git status --porcelain --untracked-files=all -- dist)"
      - name: Publish six package files and a separate attribution notice
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Formal sciences $GITHUB_REF_NAME" --generate-notes dist/* NOTICE.md
