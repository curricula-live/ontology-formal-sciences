name: Check upstream sources
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: curl --fail --location --retry 3 https://github.com/ontodev/robot/releases/download/v1.9.8/robot.jar -o "$RUNNER_TEMP/robot.jar"
      - run: ROBOT_JAR="$RUNNER_TEMP/robot.jar" python -m pipeline.upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-audit
          path: .cache/upstream-audit.json
